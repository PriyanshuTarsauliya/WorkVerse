# Application Info
spring.application.name=tech-jobs-backend
server.port=${PORT:8080}

# PostgreSQL Database Configuration
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driverClassName=org.postgresql.Driver

# H2 Web Console Enablement
spring.h2.console.enabled=false

# JPA & Hibernate Settings
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# JWT Configuration
jwt.secret=${JWT_SECRET}
jwt.expirationMs=86400000

# File Upload Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Mock Integration Config Placeholders
razorpay.key_id=${RAZORPAY_KEY_ID:rzp_test_workverse_mock_key}
razorpay.key_secret=${RAZORPAY_KEY_SECRET:mock_secret_workverse_2026}
digilocker.client_id=${DIGILOCKER_CLIENT_ID:mock_digilocker_client_id}

# Logging Configuration
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=WARN

# Jackson Date Formatting
spring.jackson.serialization.write-dates-as-timestamps=false

# CORS Configuration
app.cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:3000,https://workverse.vercel.app}
